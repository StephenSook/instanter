<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" width="2400" height="1500" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace">
  <title>Instanter architecture</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3271e"/>
    </marker>
    <marker id="aflag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>

  <rect width="2400" height="1500" fill="#141414"/>

  <text x="80" y="88" fill="#faf6f0" font-size="52" font-weight="700" letter-spacing="6">INSTANTER</text>
  <text x="80" y="128" fill="#8a8a8a" font-size="21" letter-spacing="3">GEORGIA DISPOSSESSORY ANSWER-DEADLINE TRIAGE  ·  STRANDS AGENTS ON AMAZON BEDROCK AGENTCORE</text>
  <text x="2320" y="88" fill="#b3271e" font-size="21" letter-spacing="3" text-anchor="end">THE AGENT STOPS. A LICENSED ATTORNEY DECIDES.</text>
  <line x1="80" y1="158" x2="2320" y2="158" stroke="#3a3a3a" stroke-width="2"/>

  <!-- ============ BAND 1 : what starts a run ============ -->
  <text x="80" y="212" fill="#8a8a8a" font-size="18" letter-spacing="4">1 · WHAT STARTS A RUN</text>

  <rect x="80" y="236" width="440" height="130" rx="6" fill="#1d1d1d" stroke="#b3271e" stroke-width="2.5"/>
  <text x="106" y="278" fill="#b3271e" font-size="19" letter-spacing="3">AMAZON EVENTBRIDGE SCHEDULER</text>
  <text x="106" y="310" fill="#faf6f0" font-size="22">cron(0 7 ? * MON-FRI *)</text>
  <text x="106" y="340" fill="#8a8a8a" font-size="17">America/New_York, the court's own clock</text>
  <text x="106" y="360" fill="#e8c547" font-size="17">no human presses anything</text>

  <rect x="560" y="236" width="380" height="130" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="586" y="278" fill="#8a8a8a" font-size="19" letter-spacing="3">A BROWSER, NO CREDENTIALS</text>
  <text x="586" y="310" fill="#faf6f0" font-size="22">POST /api/run</text>
  <text x="586" y="340" fill="#8a8a8a" font-size="17">a judge, a clinic, anyone</text>
  <text x="586" y="360" fill="#8a8a8a" font-size="17">no account, no key</text>

  <!-- ============ BAND 2 : the edge ============ -->
  <text x="1030" y="212" fill="#8a8a8a" font-size="18" letter-spacing="4">2 · THE CREDENTIAL-FREE DOOR</text>

  <rect x="1030" y="236" width="600" height="290" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="1056" y="278" fill="#faf6f0" font-size="24" letter-spacing="2">AMAZON CLOUDFRONT</text>
  <text x="1056" y="304" fill="#8a8a8a" font-size="17">one distribution, two origins</text>

  <rect x="1056" y="326" width="260" height="88" rx="4" fill="#141414" stroke="#3a3a3a"/>
  <text x="1074" y="354" fill="#8a8a8a" font-size="16" letter-spacing="2">DEFAULT</text>
  <text x="1074" y="378" fill="#faf6f0" font-size="19">Amazon S3</text>
  <text x="1074" y="400" fill="#8a8a8a" font-size="15">console, private, OAC</text>

  <rect x="1344" y="326" width="260" height="88" rx="4" fill="#141414" stroke="#b3271e"/>
  <text x="1362" y="354" fill="#b3271e" font-size="16" letter-spacing="2">/api/*</text>
  <text x="1362" y="378" fill="#faf6f0" font-size="19">AWS Lambda URL</text>
  <text x="1362" y="400" fill="#8a8a8a" font-size="15">AuthType NONE</text>

  <text x="1056" y="446" fill="#e8c547" font-size="16">x-instanter-origin shared secret, injected by CloudFront</text>
  <text x="1056" y="468" fill="#8a8a8a" font-size="16">OAC would force AWS_IAM, and a browser fetch cannot sign it</text>
  <text x="1056" y="492" fill="#8a8a8a" font-size="16">the Lambda holds the credential; the browser never does</text>
  <text x="1056" y="514" fill="#8a8a8a" font-size="16">separate daily spend caps: visitor and scheduled</text>

  <!-- ============ BAND 3 : the agent ============ -->
  <text x="1740" y="212" fill="#8a8a8a" font-size="18" letter-spacing="4">3 · THE AGENT</text>

  <rect x="1740" y="236" width="580" height="290" rx="6" fill="#1d1d1d" stroke="#b3271e" stroke-width="2.5"/>
  <text x="1766" y="278" fill="#faf6f0" font-size="24" letter-spacing="2">BEDROCK AGENTCORE RUNTIME</text>
  <text x="1766" y="304" fill="#8a8a8a" font-size="17">arm64 CodeZip, POST /invocations, GET /ping</text>
  <text x="1766" y="326" fill="#8a8a8a" font-size="17">session isolation, 900s ceiling</text>

  <rect x="1766" y="348" width="528" height="72" rx="4" fill="#141414" stroke="#3a3a3a"/>
  <text x="1784" y="376" fill="#faf6f0" font-size="19">Amazon Nova, via strands.models.BedrockModel</text>
  <text x="1784" y="402" fill="#8a8a8a" font-size="16">reads notes, explains a ranking. Computes no dates.</text>

  <text x="1766" y="452" fill="#8a8a8a" font-size="16">Interrupt state persists to Amazon S3, so the answer</text>
  <text x="1766" y="474" fill="#8a8a8a" font-size="16">can arrive from a different process, hours later.</text>
  <text x="1766" y="504" fill="#e8c547" font-size="17">Proven: resume across processes, on a new session id.</text>

  <!-- ============ BAND 4 : the graph ============ -->
  <line x1="80" y1="576" x2="2320" y2="576" stroke="#3a3a3a" stroke-width="2"/>
  <text x="80" y="624" fill="#8a8a8a" font-size="18" letter-spacing="4">4 · THE STRANDS AGENTS GRAPH  ·  strands.multiagent.GraphBuilder</text>

  <rect x="80" y="652" width="430" height="210" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="106" y="692" fill="#faf6f0" font-size="26" letter-spacing="2">analyst</text>
  <text x="106" y="720" fill="#8a8a8a" font-size="17">entry point</text>
  <text x="106" y="752" fill="#e8c547" font-size="17">list_cases_with_notes</text>
  <text x="106" y="776" fill="#e8c547" font-size="17">submit_case_observations</text>
  <text x="106" y="800" fill="#e8c547" font-size="17">get_ranked_queue</text>
  <text x="106" y="836" fill="#8a8a8a" font-size="16">perceives unstructured intake into typed fields</text>

  <line x1="510" y1="757" x2="596" y2="757" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="600" y="652" width="430" height="210" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="626" y="692" fill="#faf6f0" font-size="26" letter-spacing="2">writer</text>
  <text x="626" y="720" fill="#8a8a8a" font-size="17">explains, then asks</text>
  <text x="626" y="752" fill="#e8c547" font-size="17">submit_escalation_rationale</text>
  <text x="626" y="776" fill="#b3271e" font-size="17">commit_escalations  ←  INTERRUPTS HERE</text>
  <text x="626" y="812" fill="#8a8a8a" font-size="16">states in plain language why THIS case outranked</text>
  <text x="626" y="836" fill="#8a8a8a" font-size="16">the others for an attorney's scarce attention</text>

  <line x1="1030" y1="757" x2="1116" y2="757" stroke="#b3271e" stroke-width="2.5" marker-end="url(#ared)" stroke-dasharray="8 5"/>

  <rect x="1120" y="652" width="430" height="210" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="1146" y="692" fill="#faf6f0" font-size="26" letter-spacing="2">drafter</text>
  <text x="1146" y="720" fill="#8a8a8a" font-size="17">reached only on approval</text>
  <text x="1146" y="752" fill="#e8c547" font-size="17">write_packet_memo</text>
  <text x="1146" y="792" fill="#b3271e" font-size="16">attorney_action == "approved"</text>
  <text x="1146" y="814" fill="#b3271e" font-size="16">and committed_case_ids is not empty</text>
  <text x="1146" y="846" fill="#8a8a8a" font-size="16">a deferred run never reaches it</text>

  <!-- the deterministic engine -->
  <rect x="1600" y="652" width="720" height="210" rx="6" fill="#faf6f0" stroke="#b3271e" stroke-width="3"/>
  <text x="1626" y="694" fill="#b3271e" font-size="20" letter-spacing="3">THE DEADLINE MATH NEVER TOUCHES THE MODEL</text>
  <text x="1626" y="730" fill="#191919" font-size="19">Plain Python. Jurisdiction rule table, two calendar sets,</text>
  <text x="1626" y="754" fill="#191919" font-size="19">a day counter, and a full per-case trace.</text>
  <text x="1626" y="790" fill="#191919" font-size="18">O.C.G.A. 44-7-51(b)   seven days from service</text>
  <text x="1626" y="814" fill="#191919" font-size="18">O.C.G.A. 1-3-1(d)(3)  day zero is service; terminal day rolls</text>
  <text x="1626" y="838" fill="#191919" font-size="18">O.C.G.A. 1-4-1        legal holidays</text>

  <!-- ============ BAND 5 : the stop ============ -->
  <line x1="80" y1="906" x2="2320" y2="906" stroke="#3a3a3a" stroke-width="2"/>
  <text x="80" y="954" fill="#b3271e" font-size="18" letter-spacing="4">5 · THE STOP  ·  this is the product</text>

  <rect x="80" y="982" width="700" height="300" rx="6" fill="#1d1d1d" stroke="#b3271e" stroke-width="2.5"/>
  <text x="106" y="1024" fill="#faf6f0" font-size="24" letter-spacing="2">THE ATTORNEY INTERRUPT</text>
  <text x="106" y="1058" fill="#8a8a8a" font-size="18">strands.hooks.BeforeToolCallEvent  →  event.interrupt()</text>
  <text x="106" y="1082" fill="#8a8a8a" font-size="18">strands.types.interrupt.InterruptResponseContent</text>

  <text x="106" y="1126" fill="#e8c547" font-size="19">Only an EXACT approval approves.</text>
  <text x="106" y="1152" fill="#8a8a8a" font-size="17">"approve" / "approved" / "approve all", or an explicit defer</text>
  <text x="106" y="1176" fill="#8a8a8a" font-size="17">with a reason. Anything else returns invalid.</text>

  <text x="106" y="1216" fill="#e8c547" font-size="19">The approval is bound to what was actually shown.</text>
  <text x="106" y="1242" fill="#8a8a8a" font-size="17">A digest recorded at presentation is verified at approval.</text>
  <text x="106" y="1266" fill="#8a8a8a" font-size="17">Queue changed underneath: STATE CHANGED DURING APPROVAL.</text>

  <rect x="820" y="982" width="700" height="300" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="846" y="1024" fill="#faf6f0" font-size="24" letter-spacing="2">WHEN THE ANSWER IS NOT A DECISION</text>
  <text x="846" y="1062" fill="#8a8a8a" font-size="18">An unclear reply is refused rather than taken as consent.</text>
  <text x="846" y="1086" fill="#8a8a8a" font-size="18">Dropping the work would be the worse failure, so it is kept.</text>

  <text x="846" y="1130" fill="#e8c547" font-size="19">A deterministic floor commits them for later review,</text>
  <text x="846" y="1156" fill="#e8c547" font-size="19">under floor authority, never under a forged approval.</text>

  <text x="846" y="1200" fill="#b3271e" font-size="20">and the run still reports FAILURE</text>
  <text x="846" y="1230" fill="#8a8a8a" font-size="17">because nobody actually decided. The work is preserved.</text>
  <text x="846" y="1254" fill="#8a8a8a" font-size="17">The authority is not. A run nobody answers AT ALL stays</text>
  <text x="846" y="1276" fill="#8a8a8a" font-size="17">awaiting, and is listed by GET /api/awaiting.</text>

  <!-- ============ BAND 6 : the human ============ -->
  <rect x="1560" y="982" width="760" height="300" rx="6" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <text x="1586" y="1024" fill="#8a8a8a" font-size="18" letter-spacing="4">6 · WHERE THE HUMAN ANSWERS</text>

  <rect x="1586" y="1048" width="330" height="96" rx="4" fill="#141414" stroke="#3a3a3a"/>
  <text x="1604" y="1080" fill="#faf6f0" font-size="20">The operator console</text>
  <text x="1604" y="1106" fill="#8a8a8a" font-size="16">React on S3 behind CloudFront</text>
  <text x="1604" y="1128" fill="#8a8a8a" font-size="16">sweep, watch, approve or defer</text>

  <rect x="1944" y="1048" width="350" height="96" rx="4" fill="#141414" stroke="#3a3a3a"/>
  <text x="1962" y="1080" fill="#faf6f0" font-size="20">The phone, iOS and Android</text>
  <text x="1962" y="1106" fill="#8a8a8a" font-size="16">the attorney's decision surface,</text>
  <text x="1962" y="1128" fill="#8a8a8a" font-size="16">not a second console</text>

  <text x="1586" y="1184" fill="#e8c547" font-size="18">The escalation fires while the one person allowed to</text>
  <text x="1586" y="1208" fill="#e8c547" font-size="18">decide is in a hallway at the courthouse.</text>
  <text x="1586" y="1248" fill="#8a8a8a" font-size="17">Amazon DynamoDB holds every run. A sparse index on status</text>
  <text x="1586" y="1270" fill="#8a8a8a" font-size="17">answers GET /api/awaiting: what is still owed a decision.</text>
  <text x="1586" y="1296" fill="#8a8a8a" font-size="17">The audit trail lands in S3 Object Lock, Compliance mode,</text>
  <text x="1586" y="1318" fill="#8a8a8a" font-size="17">30 days: sweeps, spans, and every attorney decision.</text>

  <!-- flow arrows between bands -->
  <line x1="300" y1="372" x2="300" y2="230" stroke="#b3271e" stroke-width="0" />
  <line x1="520" y1="300" x2="556" y2="300" stroke="#8a8a8a" stroke-width="0"/>
  <line x1="944" y1="300" x2="1024" y2="300" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1634" y1="380" x2="1734" y2="380" stroke="#b3271e" stroke-width="2.5" marker-end="url(#ared)"/>
  <path d="M300 372 L300 400 L1000 400 L1000 300 L1024 300" fill="none" stroke="#b3271e" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- footer -->
  <line x1="80" y1="1330" x2="2320" y2="1330" stroke="#3a3a3a" stroke-width="2"/>
  <text x="80" y="1372" fill="#8a8a8a" font-size="19">LIVE, NO CREDENTIALS:  d2ew2t4uldglcr.cloudfront.net   ·   /api/stats recomputes all 46 deadlines on every request, never cached</text>
  <text x="80" y="1404" fill="#faf6f0" font-size="22">4 of 46 answer deadlines in the corpus are ones counting seven days by hand gets wrong.</text>
  <text x="80" y="1432" fill="#8a8a8a" font-size="18">3 roll off a weekend under O.C.G.A. 1-3-1(d)(3).  1 is controlled by a summons stating a different date under O.C.G.A. 44-7-51(b).</text>
  <text x="80" y="1462" fill="#8a8a8a" font-size="17">Case records are synthetic and labelled as such. The statute, the court calendar, and every computation are real.</text>
</svg>
