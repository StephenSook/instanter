[project]
name = "instanter"
version = "0.1.0"
description = "Background triage agent for eviction-defense clinics: deterministic Georgia answer-deadline engine, Strands Agents orchestration, attorney-in-the-loop escalation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen Sookra", email = "stephensookra@gmail.com" }]
dependencies = [
    "pydantic>=2.13.4",
    "strands-agents>=1.53.0",
    "strands-agents-tools>=0.8.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "strands-agents-evals>=1.2.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", "console", "mobile", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["engine"]
