<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Instanter">
  <title>Instanter</title>
  <!--
    The stamp and the countdown are the same mark, because in this product they
    are the same act: the clock the answer deadline runs on, drawn as the ring an
    attorney presses onto a filing. Geometry is exact rather than textured: the
    rough stamp edge on the app icon is invisible at 16px and only muddies it.
    Colours are the console's own paper and stamp tokens.
  -->
  <rect width="64" height="64" rx="12" fill="#faf6f0"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#b3271e" stroke-width="6"/>
  <path d="M32 32 L32 17 A15 15 0 0 1 43.49 22.38 Z" fill="#b3271e"/>
</svg>
